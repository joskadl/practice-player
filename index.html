<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f5d50" />
  <meta name="description" content="Rehearse MIDI, MusicXML, and MuseScore files with mute/solo, sheet music, and a built-in choir soundfont." />
  <title>MIDI Practice Player</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" href="./vendor/opensheetmusicdisplay.min.js" as="script" />
  <link rel="preload" href="./vendor/libfluidsynth-2.4.6.js" as="script" />
  <link rel="preload" href="./soundfonts/TimGM6mb.sf2" as="fetch" crossorigin />
</head>
<body>
  <div id="updateBanner" class="update-banner" hidden role="status" aria-live="polite">
    <span id="updateBannerText" class="update-banner-text"></span>
    <div class="update-banner-actions">
      <button type="button" id="updateNowBtn" class="update-now-btn" data-i18n="updateNow">Update now</button>
      <button type="button" id="updateLaterBtn" class="secondary update-later-btn" data-i18n="updateLater">Later</button>
    </div>
  </div>
  <button type="button" id="langToggle" class="lang-toggle" aria-pressed="true" data-i18n-title="langToggleTip">EN</button>

  <main class="app">
    <header class="header">
      <div class="header-row">
        <h1 data-i18n="title">MIDI Practice Player</h1>
        <button type="button" id="installBtn" class="secondary install-btn" hidden data-i18n="install" data-i18n-title="installTip">
          Install
        </button>
      </div>
    </header>

    <section class="panel load-panel">
      <div class="open-menu" id="openMenuWrap">
        <button type="button" id="openMenuBtn" class="file-btn-like" data-i18n="open" data-i18n-title="openTip" aria-haspopup="menu" aria-expanded="false">Open</button>
        <div id="openMenu" class="open-menu-panel" role="menu" hidden>
          <button type="button" id="openDeviceBtn" class="open-menu-item" role="menuitem" data-i18n="openFromDevice">From this device…</button>
          <div class="open-menu-sep" role="separator"></div>
          <div class="open-menu-heading" data-i18n="examples">Examples</div>
          <div id="examplesList" class="open-menu-examples"></div>
        </div>
        <input id="fileInput" type="file" accept=".mid,.midi,.musicxml,.xml,.mxl,.mscz,.mscx,audio/midi,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml,application/xml,text/xml" hidden />
      </div>
      <span id="fileName" class="file-name">No file loaded</span>
      <a id="recordingLink" class="recording-link" hidden rel="noopener noreferrer" target="_blank" data-i18n-title="recordingLinkTip"></a>
      <button type="button" id="recordingEditBtn" class="secondary recording-edit-btn" hidden data-i18n="recordingEdit" data-i18n-title="recordingEditTip">Recording…</button>
      <label class="inline">
        <span data-i18n="sound">Sound</span>
        <select id="instrumentSelect">
          <option value="score" selected data-i18n="scoreInstruments">Score instruments</option>
          <option value="52" data-i18n="choirAahs">Choir Aahs</option>
          <option value="53" data-i18n="voiceOohs">Voice Oohs</option>
          <option value="0" data-i18n="acousticPiano">Acoustic Piano</option>
          <option value="48" data-i18n="strings">Strings</option>
          <option value="40" data-i18n="violin">Violin</option>
          <option value="42" data-i18n="cello">Cello</option>
          <option value="73" data-i18n="flute">Flute</option>
          <option value="65" data-i18n="altoSax">Alto Sax</option>
        </select>
      </label>
      <span id="status" class="status" aria-live="polite"></span>
    </section>

    <section class="panel transport-panel">
      <div class="transport-btns">
        <button type="button" id="playBtn" disabled data-i18n="play">Play</button>
        <button type="button" id="pauseBtn" disabled data-i18n="pause">Pause</button>
        <button type="button" id="stopBtn" disabled data-i18n="stop">Stop</button>
      </div>
      <label class="inline">
        <span data-i18n="tempo">Tempo</span>
        <input id="tempoBpm" class="tempo-bpm" type="number" min="20" max="400" step="1" value="120" disabled />
        <span id="tempoLabel">BPM</span>
      </label>
      <div class="time-row">
        <span id="timeLabel">0:00.0</span>
        <input id="seek" type="range" min="0" max="0" value="0" step="1" disabled />
        <span id="durationLabel">0:00.0</span>
      </div>
      <label id="tuningRow" class="tuning-inline" hidden data-i18n-title="tuningTipStandard">
        <input id="tuningToggle" type="checkbox" />
        <span id="tuningModeLabel" data-i18n="tuningStandard">12-TET</span>
      </label>
    </section>

    <section class="panel score-panel" id="scorePanel" data-i18n-title="scoreTip">
      <div class="voices-head">
        <h2 id="scoreHeading" data-i18n="score">Score</h2>
        <div class="view-toggle" role="group" data-i18n-aria="scoreView">
          <button type="button" id="viewRollBtn" class="secondary view-btn" aria-pressed="true" disabled data-i18n="pianoRoll">Piano roll</button>
          <button type="button" id="viewSheetBtn" class="secondary view-btn" aria-pressed="false" disabled data-i18n="sheetMusic">Sheet music</button>
        </div>
        <div id="sheetZoomControls" class="sheet-zoom" hidden>
          <button type="button" id="sheetZoomOutBtn" class="secondary" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">−</button>
          <span id="sheetZoomLabel" class="sheet-zoom-label">55%</span>
          <button type="button" id="sheetZoomInBtn" class="secondary" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">+</button>
          <button type="button" id="sheetPdfBtn" class="secondary sheet-pdf-btn" data-i18n-title="exportPdfTip" data-i18n-aria="exportPdf">
            PDF
          </button>
          <label class="sheet-key-mod" data-i18n-title="modulateTip">
            <span class="sheet-key-mod-label" data-i18n="modulate">Key</span>
            <select id="keyCenterSelect" data-i18n-aria="modulate" disabled>
              <option value="">—</option>
            </select>
          </label>
          <button type="button" id="sheetSaveBtn" class="sheet-save-btn" hidden data-i18n-title="saveScoreTip" data-i18n-aria="saveScore">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="sheetStage" class="sheet-stage" hidden>
        <div class="sheet-fs-chrome">
          <div class="sheet-fs-transport" role="group" data-i18n-aria="transport">
            <button type="button" id="sheetFsPlayBtn" data-i18n="play">Play</button>
            <button type="button" id="sheetFsPauseBtn" data-i18n="pause">Pause</button>
            <button type="button" id="sheetFsStopBtn" data-i18n="stop">Stop</button>
          </div>
          <div class="sheet-fs-zoom" role="group" data-i18n-aria="zoom">
            <button type="button" id="sheetFsZoomOutBtn" class="secondary" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">−</button>
            <button type="button" id="sheetFsZoomInBtn" class="secondary" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">+</button>
          </div>
          <span class="sheet-fs-hint" data-i18n="fullscreenEscHint">Esc to exit</span>
        </div>
        <div id="sheetAnnotBar" class="sheet-annot-bar" hidden>
          <div class="sheet-view-mode" role="radiogroup" data-i18n-aria="viewMode">
            <button type="button" role="radio" id="viewModeScore" class="view-mode-btn" aria-checked="true" data-i18n="viewModeScore" data-i18n-title="viewModeScoreTip">Score</button>
            <button type="button" role="radio" id="viewModeLyrics" class="view-mode-btn" aria-checked="false" data-i18n="viewModeLyrics" data-i18n-title="viewModeLyricsTip">Lyrics</button>
            <button type="button" role="radio" id="viewModeCustom" class="view-mode-btn" aria-checked="false" data-i18n="viewModeCustom" data-i18n-title="viewModeCustomTip">Custom</button>
          </div>
          <div id="sheetLayerCustom" class="sheet-layer-custom" hidden>
            <div class="annot-toggles" role="group" data-i18n-aria="layers">
              <button type="button" id="layerStavesBtn" class="secondary annot-toggle" aria-pressed="true" data-i18n="staves" data-i18n-title="stavesTip">Staves</button>
              <button type="button" id="layerLyricsBtn" class="secondary annot-toggle" aria-pressed="true" data-i18n="lyrics" data-i18n-title="lyricsTip">Lyrics</button>
              <button type="button" id="layerChordsBtn" class="secondary annot-toggle" aria-pressed="true" data-i18n="chords" data-i18n-title="chordsTip">Chords</button>
              <button type="button" id="layerNotesBtn" class="secondary annot-toggle" aria-pressed="true" data-i18n="notesLayer" data-i18n-title="notesLayerTip">Notes</button>
            </div>
          </div>
          <div class="annot-add" role="group" data-i18n-aria="addAnnotations">
            <button type="button" id="addChordBtn" class="secondary" data-i18n="addChord" data-i18n-title="addChordTip">+ Chord</button>
            <button type="button" id="addNoteBtn" class="secondary" data-i18n="addNote" data-i18n-title="addNoteTip">+ Note</button>
          </div>
        </div>
        <div class="sheet-music-frame">
          <div id="sheetMusic" class="sheet-music">
            <p class="hint sheet-placeholder" data-i18n="sheetPlaceholder">Load a MusicXML file to see sheet music here.</p>
          </div>
          <button
            type="button"
            id="sheetFullscreenBtn"
            class="sheet-expand-btn"
            data-i18n-title="fullscreenTip"
            data-i18n-aria="fullscreen"
            aria-pressed="false"
          >
            <svg class="sheet-fs-icon sheet-fs-icon-enter" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
            <svg class="sheet-fs-icon sheet-fs-icon-exit" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden>
              <path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
          </button>
        </div>
      </div>
      <canvas
        id="pianoRoll"
        class="piano-roll"
        width="800"
        height="220"
        tabindex="0"
        role="slider"
        data-i18n-aria="rollAria"
      ></canvas>
      <div id="busyOverlay" class="busy-overlay" hidden aria-live="polite" aria-atomic="true">
        <div class="busy-card">
          <span class="busy-spinner" aria-hidden="true"></span>
          <span id="busyLabel" class="busy-label" data-i18n="busyWorking">Working…</span>
        </div>
      </div>
      <div id="remarksRow" class="remarks-row" hidden>
        <label for="remarksInput" data-i18n="remarks">Remarks</label>
        <textarea
          id="remarksInput"
          class="remarks-input"
          rows="3"
          spellcheck="true"
          data-i18n-placeholder="remarksPlaceholder"
          placeholder="General remarks for this score…"
        ></textarea>
      </div>
    </section>

    <section class="panel">
      <div class="voices-head">
        <h2 data-i18n="voices">Voices</h2>
        <div class="voice-actions">
          <button type="button" id="exportMp3Btn" class="secondary" disabled data-i18n="exportMp3" data-i18n-title="exportMp3Tip">Export MP3</button>
          <button type="button" id="muteAllBtn" disabled data-i18n="muteAll">Mute all</button>
          <button type="button" id="unmuteAllBtn" disabled data-i18n="unmuteAll">Unmute all</button>
        </div>
      </div>
      <label id="accompRow" class="inline accomp-row" hidden>
        <span data-i18n="otherVoices">Other voices</span>
        <input id="accompPercent" type="range" min="0" max="100" value="25" disabled />
        <span id="accompLabel">25%</span>
      </label>
      <ul id="voiceList" class="voice-list"></ul>
      <p id="emptyVoices" class="hint" data-i18n="emptyVoices">Open a MIDI or MusicXML file to see voices here.</p>
    </section>

    <section id="syncPanel" class="panel sync-panel" hidden>
      <div class="voices-head">
        <h2 data-i18n="sharedPractice">Shared practice</h2>
        <div class="voice-actions">
          <button type="button" id="syncUndoBtn" class="secondary" disabled data-i18n="undo" data-i18n-title="undoTip">Undo</button>
          <button type="button" id="syncPullBtn" class="secondary" disabled data-i18n="pull">Pull</button>
          <button type="button" id="syncPushBtn" disabled data-i18n="push">Push</button>
        </div>
      </div>
      <p id="syncStatus" class="hint tight sync-status" hidden></p>
      <div class="sync-actions">
        <button type="button" id="syncExportBtn" class="secondary" disabled data-i18n="exportPack">Export pack</button>
        <label class="file-btn secondary-file">
          <span data-i18n="importPack">Import pack</span>
          <input id="syncImportInput" type="file" accept=".json,application/json" hidden />
        </label>
        <button type="button" id="syncSettingsToggle" class="secondary" data-i18n="syncSettings" data-i18n-title="syncSettingsTip">Sync settings</button>
      </div>
      <div id="syncSettings" class="sync-settings" hidden>
        <label class="sheet-edit-field">
          <span data-i18n="yourName">Your name (for history)</span>
          <input id="syncAuthorInput" type="text" autocomplete="nickname" placeholder="e.g. Joska" />
        </label>
        <div class="sync-settings-grid">
          <label class="sheet-edit-field"><span data-i18n="owner">Owner</span><input id="ghOwner" type="text" placeholder="username" autocomplete="off" /></label>
          <label class="sheet-edit-field"><span data-i18n="repo">Repo</span><input id="ghRepo" type="text" placeholder="midi-practice-player" autocomplete="off" /></label>
          <label class="sheet-edit-field"><span data-i18n="path">Path</span><input id="ghPath" type="text" placeholder="shared/" autocomplete="off" /></label>
          <label class="sheet-edit-field"><span data-i18n="branch">Branch</span><input id="ghBranch" type="text" placeholder="main" autocomplete="off" /></label>
        </div>
        <label class="sheet-edit-field">
          <span data-i18n="ghToken">GitHub token (Contents + Actions read/write)</span>
          <input id="ghToken" type="password" autocomplete="off" placeholder="ghp_…" />
        </label>
        <label class="sheet-edit-field">
          <span data-i18n="remoteUrl">Or generic remote JSON URL (GET pull / PUT push)</span>
          <input id="remoteUrl" type="url" placeholder="https://…" autocomplete="off" />
        </label>
        <button type="button" id="syncSettingsSave" class="secondary" data-i18n="saveSettings">Save settings</button>
      </div>
      <div class="notes-block">
        <h3 class="notes-heading" data-i18n="rehearsalNotes">Rehearsal notes</h3>
        <ul id="notesList" class="notes-list"></ul>
        <div class="notes-add">
          <input id="noteInput" type="text" data-i18n-placeholder="addSharedNote" placeholder="Add a shared note…" disabled />
          <button type="button" id="noteAddBtn" class="secondary" disabled data-i18n="add">Add</button>
        </div>
      </div>
      <details id="historyDetails" class="history-details">
        <summary data-i18n="editHistory">Edit history</summary>
        <ol id="historyList" class="history-list"></ol>
      </details>
    </section>
  </main>

  <footer class="app-footer">
    <span id="appVersion" class="app-version"></span>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
